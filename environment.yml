# =============================================================================
# Conda/mamba environment for
#   "Spatial Data Science: The New Frontier in Analytics"
#
#   conda env create -f environment.yml      (or: mamba env create -f ...)
#   conda activate gis-course
#
# Conda-forge ships pre-built GDAL/GEOS/PROJ binaries, which removes the single
# most common source of geospatial installation pain. If pip has given you
# "ImportError: libgdal..." or "DLL load failed", use this file instead.
# =============================================================================
name: gis-course
channels:
  - conda-forge
dependencies:
  - python=3.12

  # core scientific stack
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11

  # the three pillars
  - geopandas>=1.0
  - shapely>=2.0
  - rasterio>=1.3

  # vector I/O and CRS
  - pyogrio>=0.8
  - fiona>=1.9
  - pyproj>=3.6

  # visualisation
  - matplotlib>=3.8
  - seaborn>=0.13
  - mapclassify>=2.6
  - contextily>=1.5

  # statistics and machine learning
  - scikit-learn>=1.4
  - statsmodels>=0.14

  # fast intermediate storage
  - pyarrow>=15.0

  # notebook
  - jupyterlab>=4.0
  - ipykernel>=6.29

  # optional: only needed to rebuild the PDF from course_src/
  # - markdown>=3.5
  # - pygments>=2.17
  # - weasyprint>=60
